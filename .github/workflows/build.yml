name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          mv app/build/outputs/apk/release/app-release.apk "saldo-v1.0.${{ github.run_number }}.apk"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: saldo-apk
          path: saldo-*.apk

      - name: Publicar Release (para descargar desde el móvil)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Saldo v1.0.${{ github.run_number }}
          files: saldo-*.apk
          make_latest: true
